# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "dashboard_formula1"



include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard
  

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405606992773183.3.azuredatabricks.net/
    variables:
      catalog: formula1
      schema: gold
      warehouse_id: 4b5864c05cc37a4
  prod:
    mode: production
    workspace:
      host: https://adb-7405617675991585.5.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/fcamifox@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/fcamifox@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: formula1_dev
      schema: gold
      warehouse_id: affb420b902a6f8c
    permissions:
      - user_name: fcamifox@gmail.com
        level: CAN_MANAGE