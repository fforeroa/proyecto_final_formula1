name: Dynamic Databricks Notebook Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      storageName:
        description: "Nombre del Storage"
        required: true
        default: "datalakefforeroprod03"

      catalog:
        description: "Catalogo"
        required: true
        default: "formula1_prod"

      credential:
        description: "Nombre de la Storage Credential"
        required: true
        default: "credential_formula1_prod"

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout Repository
      uses: actions/checkout@v4


    # ============================================================
    # 2. INSTALAR HERRAMIENTAS
    # ============================================================

    - name: Install jq & curl
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl


    # ============================================================
    # 3. DEFINIR VARIABLES PROD
    # ============================================================

    - name: Definir variables PROD
      run: |

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          STORAGE_NAME="${{ github.event.inputs.storageName }}"
          CATALOG="${{ github.event.inputs.catalog }}"
          CREDENTIAL="${{ github.event.inputs.credential }}"
        else
          STORAGE_NAME="datalakefforeroprod03"
          CATALOG="formula1_prod"
          CREDENTIAL="credential_formula1_prod"
        fi

        echo "STORAGE_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "CATALOG=$CATALOG" >> $GITHUB_ENV
        echo "CREDENTIAL=$CREDENTIAL" >> $GITHUB_ENV

        echo "STORAGE_NAME=$STORAGE_NAME"
        echo "CATALOG=$CATALOG"
        echo "CREDENTIAL=$CREDENTIAL"

    # ============================================================
    # CREAR ESTRUCTURA DE CARPETAS EN PROD
    # ============================================================

    - name: Crear estructura Workspace PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "========================================"
        echo "CREANDO ESTRUCTURA WORKSPACE PROD"
        echo "========================================"

        FOLDERS=(
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/03-gold"
        )

        for FOLDER in "${FOLDERS[@]}"; do

          echo ""
          echo "Verificando/creando:"
          echo "$FOLDER"

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"$FOLDER\"}" \
            "$DATABRICKS_HOST/api/2.0/workspace/mkdirs")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "$BODY"
            exit 1
          fi

          echo "OK"

        done

        echo ""
        echo "========================================"
        echo "ESTRUCTURA WORKSPACE LISTA"
        echo "========================================"

    # ============================================================
    # 4. EXPORTAR NOTEBOOKS PREP DESDE DEV
    # ============================================================

    - name: Exportar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_prep

        NOTEBOOKS=(
          "01.Setup Project Environment"
          "02.Ayuda_Bronze"
          "03.Configuracion_Ambiente"
          "04.Ayuda_Silver"
          "test"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "Exportando: $NOTEBOOK"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb/$NOTEBOOK', safe=''))")

          curl -f -s \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=DBC" \
            > "exported_prep/${NOTEBOOK}.json"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 5. IMPORTAR NOTEBOOKS PREP A PROD
    # ============================================================

    - name: Importar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
        echo "Creando directorio:"
        echo "$DEST_PATH"

        curl -f -sS \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"path\": \"$DEST_PATH\",
            \"overwrite\": true
          }" \
           "$DATABRICKS_HOST/api/2.0/workspace/mkdirs"
        
        echo "Directorio creado o ya existente"

        for FILE in exported_prep/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo "Importando: $NOTEBOOK"

          CONTENT=$(jq -r '.content' "$FILE")

          curl -f -s \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"DBC\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import"

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 6. EXPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Exportar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_bronze

        NOTEBOOKS=(
          "01.Ingest Circuits File"
          "02.Ingest Races File"
          "03.Ingest Constructors File"
          "04.Ingest Drivers File"
          "05.Ingest Results File"
          "06.Ingest Sprints File"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "========================================"
          echo "Exportando: $NOTEBOOK"
          echo "========================================"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/$NOTEBOOK', safe=''))")

          curl -f -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=SOURCE" \
            > "exported_bronze/${NOTEBOOK}.json"

          echo "Validando JSON..."

          jq empty "exported_bronze/${NOTEBOOK}.json"

          echo "Contenido exportado:"
          jq -r '.content' "exported_bronze/${NOTEBOOK}.json" | wc -c

          echo "OK: $NOTEBOOK"

        done
    

    # ============================================================
    # 7. IMPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Importar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"

        echo "========================================"
        echo "IMPORTANDO NOTEBOOKS BRONZE"
        echo "========================================"

        for FILE in exported_bronze/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo ""
          echo "========================================"
          echo "Importando: $NOTEBOOK"
          echo "========================================"

          CONTENT=$(jq -r '.content' "$FILE")

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "ERROR: El archivo no contiene content"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"SOURCE\",
              \"language\": \"PYTHON\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "Respuesta:"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR importando $NOTEBOOK"
            exit 1
          fi

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 8. EXPORTAR NOTEBOOKS SILVER
    # ============================================================

    - name: Exportar notebooks Silver
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_silver

        NOTEBOOKS=(
          "01.Transform Circuits Data"
          "02.Transform Races Data"
          "03.Transform Constructors Data"
          "04.Transform Drivers Data"
          "05.Transform Results Data"
          "06.Transform Sprints Data"
          "91.Build_Nationality_Region_Reference"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "========================================"
          echo "Exportando: $NOTEBOOK"
          echo "========================================"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/$NOTEBOOK', safe=''))")

          curl -f -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=SOURCE" \
            > "exported_silver/${NOTEBOOK}.json"

          echo "Validando JSON..."

          jq empty "exported_silver/${NOTEBOOK}.json"

          echo "Contenido exportado:"
          jq -r '.content' "exported_silver/${NOTEBOOK}.json" | wc -c

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 9. IMPORTAR NOTEBOOKS SILVER
    # ============================================================

    - name: Importar notebooks Silver
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver"

        echo "========================================"
        echo "IMPORTANDO NOTEBOOKS SILVER"
        echo "========================================"

        for FILE in exported_silver/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo ""
          echo "========================================"
          echo "Importando: $NOTEBOOK"
          echo "========================================"

          CONTENT=$(jq -r '.content' "$FILE")

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "ERROR: El archivo no contiene content"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"SOURCE\",
              \"language\": \"PYTHON\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "Respuesta:"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR importando $NOTEBOOK"
            exit 1
          fi

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 8. CREAR EXTERNAL LOCATION METASTORE
    # ============================================================

    - name: Crear External Location exlt-metastore
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        RESPONSE=$(curl -s \
          -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"exlt-metastore_prod\",
            \"url\": \"abfss://metastore@${STORAGE_NAME}.dfs.core.windows.net/\",
            \"credential_name\": \"${CREDENTIAL}\",
            \"comment\": \"External Location Metastore Formula1\"
          }" \
          "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations")

        echo "$RESPONSE"


    # ============================================================
    # 9. CREAR EXTERNAL LOCATIONS
    # ============================================================

    - name: Crear External Locations PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        create_external_location() {

          LOCATION_NAME="$1"
          CONTAINER="$2"

          echo ""
          echo "========================================"
          echo "Creando External Location: $LOCATION_NAME"
          echo "========================================"

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$LOCATION_NAME\",
              \"url\": \"abfss://${CONTAINER}@${STORAGE_NAME}.dfs.core.windows.net/\",
              \"credential_name\": \"${CREDENTIAL}\",
              \"comment\": \"External Location Formula1 PROD\"
            }" \
            "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations")

          echo "$RESPONSE"

        }

        create_external_location "exlt-raw_prod" "raw"
        create_external_location "exlt-bronze_prod" "bronze"
        create_external_location "exlt-silver_prod" "silver"
        create_external_location "exlt-golden_prod" "golden"


    # ============================================================
    # 10. CREAR CATALOGO
    # ============================================================

    - name: Crear Catalogo Unity Catalog
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "Creando catalogo: $CATALOG"

        RESPONSE=$(curl -s \
          -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"$CATALOG\",
            \"storage_root\": \"abfss://metastore@${STORAGE_NAME}.dfs.core.windows.net/\",
            \"comment\": \"Catalogo para la arquitectura medallion del proyecto Formula1 PROD\"
          }" \
          "$DATABRICKS_HOST/api/2.1/unity-catalog/catalogs")

        echo "$RESPONSE"


    # ============================================================
    # 11. CREAR SCHEMAS
    # ============================================================

    - name: Crear Schemas Bronze Silver Gold
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        create_schema() {

          SCHEMA="$1"
          CONTAINER="$2"

          echo ""
          echo "========================================"
          echo "Creando schema: $CATALOG.$SCHEMA"
          echo "========================================"

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$SCHEMA\",
              \"catalog_name\": \"$CATALOG\",
              \"storage_root\": \"abfss://${CONTAINER}@${STORAGE_NAME}.dfs.core.windows.net/${SCHEMA}\",
              \"comment\": \"Schema $SCHEMA del proyecto Formula1 PROD\"
            }" \
            "$DATABRICKS_HOST/api/2.1/unity-catalog/schemas")

          echo "$RESPONSE"

        }

        create_schema "bronze" "bronze"
        create_schema "silver" "silver"
        create_schema "golden" "golden"

    # ============================================================
    # CREAR / ACTUALIZAR JOB FORMULA1 PROD
    # PRUEBA: 2 NOTEBOOKS
    # ============================================================

    - name: Crear o actualizar Job Formula1 PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "========================================"
        echo "CREANDO / ACTUALIZANDO JOB FORMULA1"
        echo "========================================"

        STORAGE_NAME="datalakefforeroprod03"
        CATALOG="formula1_prod"

        echo "Storage : $STORAGE_NAME"
        echo "Catalog : $CATALOG"

        # --------------------------------------------------------
        # CREAR CONFIGURACION DEL JOB
        # --------------------------------------------------------

        cat > job_config.json <<EOF
        {
          "name": "Job_Formula_1",
          "max_concurrent_runs": 1,

          "tasks": [

            {
              "task_key": "01_Ingest_Circuits_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/01.Ingest Circuits File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "01_Transform_Circuits_Data",

              "depends_on": [
                {
                  "task_key": "01_Ingest_Circuits_File"
                }
              ],

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/01.Transform Circuits Data",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "02_Ingest_Races_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/02.Ingest Races File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "02_Transform_Races_Data",

              "depends_on": [
                {
                  "task_key": "02_Ingest_Races_File"
                }
              ],

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/02.Transform Races Data",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "Build_Nationality_Region_Reference",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/91.Build_Nationality_Region_Reference",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "03_Ingest_Constructors_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/03.Ingest Constructors File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "04_Ingest_Drivers_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/04.Ingest Drivers File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "05_Ingest_Results_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/05.Ingest Results File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            {
              "task_key": "06_Ingest_Sprints_File",

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/06.Ingest Sprints File",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },

            
            {
              "task_key": "03_Transform_Constructors_Data",

              "depends_on": [
                {
                  "task_key": "03_Ingest_Constructors_File"
                  "task_key": "Build_Nationality_Region_Reference"
                }
              ],

              "notebook_task": {
                "notebook_path": "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/03.Transform Constructors Data",
                "source": "WORKSPACE",

                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              },

              "environment_key": "Default"
            },



          ],

          "environments": [
            {
              "environment_key": "Default",

              "spec": {
                "environment_version": "5"
              }
            }
          ],

          "queue": {
            "enabled": true
          }
        }
        EOF

        echo ""
        echo "========================================"
        echo "JOB CONFIGURATION"
        echo "========================================"

        jq . job_config.json

        # --------------------------------------------------------
        # BUSCAR SI EL JOB YA EXISTE
        # --------------------------------------------------------

        echo ""
        echo "Buscando Job_Formula_1..."

        JOBS_RESPONSE=$(curl -sS \
          -X GET \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.1/jobs/list?limit=100")

        echo "$JOBS_RESPONSE" | jq .

        JOB_ID=$(echo "$JOBS_RESPONSE" | jq -r '
          .jobs[]
          | select(.settings.name == "Job_Formula_1")
          | .job_id
        ' | head -n 1)

        # --------------------------------------------------------
        # CREAR SI NO EXISTE
        # --------------------------------------------------------

        if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then

          echo ""
          echo "========================================"
          echo "JOB NO EXISTE"
          echo "CREANDO JOB..."
          echo "========================================"

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d @job_config.json \
            "$DATABRICKS_HOST/api/2.1/jobs/create")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "$BODY" | jq .

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: No se pudo crear el Job"
            exit 1
          fi

          JOB_ID=$(echo "$BODY" | jq -r '.job_id')

          echo "Job creado correctamente."

        else

          # ------------------------------------------------------
          # ACTUALIZAR / SOBRESCRIBIR JOB EXISTENTE
          # ------------------------------------------------------

          echo ""
          echo "========================================"
          echo "JOB EXISTENTE"
          echo "JOB_ID = $JOB_ID"
          echo "SOBRESCRIBIENDO CONFIGURACION..."
          echo "========================================"

          RESET_PAYLOAD=$(jq \
            --argjson job_id "$JOB_ID" \
            '{job_id: $job_id, new_settings: .}' \
            job_config.json)

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RESET_PAYLOAD" \
            "$DATABRICKS_HOST/api/2.1/jobs/reset")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "$BODY" | jq .

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: No se pudo actualizar el Job"
            exit 1
          fi

          echo "Job actualizado correctamente."

        fi

        # --------------------------------------------------------
        # VALIDAR JOB_ID
        # --------------------------------------------------------

        if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
          echo "ERROR: JOB_ID está vacío"
          exit 1
        fi

        echo ""
        echo "========================================"
        echo "JOB LISTO"
        echo "JOB_ID = $JOB_ID"
        echo "========================================"

        # IMPORTANTE:
        # Guardamos JOB_ID para el siguiente step de GitHub Actions

        echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

   # ============================================================
   # EJECUTAR JOB FORMULA1 PROD
   # ============================================================

    - name: Ejecutar Job Formula1 PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "========================================"
        echo "EJECUTANDO JOB FORMULA1 PROD"
        echo "========================================"

        echo "JOB_ID=$JOB_ID"

        if [ -z "$JOB_ID" ]; then
          echo "ERROR: JOB_ID está vacío"
          exit 1
        fi

        RESPONSE=$(curl -sS \
          -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"job_id\": $JOB_ID}" \
          "$DATABRICKS_HOST/api/2.1/jobs/run-now")

        HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        echo "HTTP CODE = $HTTP_CODE"

        echo "Respuesta:"
        echo "$BODY" | jq .

        if [ "$HTTP_CODE" != "200" ]; then
          echo "ERROR: Databricks no pudo iniciar el Job"
          exit 1
        fi

        RUN_ID=$(echo "$BODY" | jq -r '.run_id')

        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "ERROR: No se obtuvo RUN_ID"
          exit 1
        fi

        echo ""
        echo "========================================"
        echo "JOB INICIADO"
        echo "RUN_ID = $RUN_ID"
        echo "========================================"

        echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

   # ============================================================
   # ESPERAR RESULTADO DEL JOB
   # ============================================================

    - name: Esperar resultado del Job
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "========================================"
        echo "ESPERANDO RESULTADO DEL JOB"
        echo "========================================"

        echo "RUN_ID=$RUN_ID"

        if [ -z "$RUN_ID" ]; then
          echo "ERROR: RUN_ID está vacío"
          exit 1
        fi

        while true; do

          RESPONSE=$(curl -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID")

          LIFE_CYCLE=$(echo "$RESPONSE" | jq -r '.state.life_cycle_state')
          RESULT_STATE=$(echo "$RESPONSE" | jq -r '.state.result_state')
          STATE_MESSAGE=$(echo "$RESPONSE" | jq -r '.state.state_message')

          echo ""
          echo "----------------------------------------"
          echo "Life Cycle   : $LIFE_CYCLE"
          echo "Result State : $RESULT_STATE"
          echo "Mensaje      : $STATE_MESSAGE"
          echo "----------------------------------------"

          case "$LIFE_CYCLE" in

            TERMINATED)
              echo ""
              echo "Job terminado."

              if [ "$RESULT_STATE" = "SUCCESS" ]; then
                echo ""
                echo "========================================"
                echo "JOB EXITOSO"
                echo "========================================"
                exit 0
              else
                echo ""
                echo "========================================"
                echo "JOB FALLIDO"
                echo "========================================"
                exit 1
              fi
              ;;

            SKIPPED)
              echo "Job skipped."
              exit 1
              ;;

            INTERNAL_ERROR)
              echo "Error interno del Job."
              exit 1
              ;;

            *)
              echo "Job todavía ejecutándose..."
              sleep 10
              ;;

          esac

        done