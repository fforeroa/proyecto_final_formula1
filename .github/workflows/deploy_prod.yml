name: Dynamic Databricks Notebook Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl
    
    - name: Export multiple notebooks preparacion ambiente
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
        NOTEBOOKS=("01.Setup Project Environment" "02.Ayuda_Bronze" "03.Configuracion_Ambiente" "04.Ayuda_Silver" "test")
        
        mkdir -p notebooks_to_deploy
        for nb in "${NOTEBOOKS[@]}"; do
          echo "Exportando $nb en formato DBC..."
          nb_encoded="${nb// /%20}"
          
          # Usamos formato DBC para garantizar compatibilidad multi-lenguaje
          curl -f -s -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb_encoded&format=DBC&direct_download=true" \
            --output "notebooks_to_deploy/$nb.dbc"
        done

    - name: Deploy notebooks to Destination Workspace prepracion ambiente
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
        
        echo "Creando carpeta base $DEST_BASE si no existe..."
        curl -f -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"
          
        # Procesamos la extensión .dbc de forma nativa
        for file in notebooks_to_deploy/*.dbc; do
          [ -e "$file" ] || continue
          
          name=$(basename "$file" .dbc)
          dest_path="$DEST_BASE/$name"
          
          echo "Importando $file → $dest_path"
          response=$(curl -f -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: multipart/form-data" \
            -F "path=$dest_path" \
            -F "format=DBC" \
            -F "overwrite=true" \
            -F "content=@$file" \
            "$DEST_HOST/api/2.0/workspace/import")
          echo "Response: $response"
        done
    
    - name: Export multiple notebooks bronze
      run: |
        ORIGIN_HOST=${{ secrets.DATABRICKS_ORIGIN_HOST }}
        ORIGIN_TOKEN=${{ secrets.DATABRICKS_ORIGIN_TOKEN }}
        NOTEBOOK_BASE="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"
        NOTEBOOKS=("01.Ingest Circuits File" "02.Ingest Races File" "03.Ingest Constructors File" "04.Ingest Drivers File" "05.Ingest Results File" "06.Ingest Sprints File")
        
        rm -rf notebooks_to_deploy
        mkdir -p notebooks_to_deploy
        
        for nb in "${NOTEBOOKS[@]}"; do
          echo "Exportando $nb en formato DBC..."
          nb_encoded="${nb// /%20}"
          
          curl -f -s -X GET \
            -H "Authorization: Bearer $ORIGIN_TOKEN" \
            "$ORIGIN_HOST/api/2.0/workspace/export?path=$NOTEBOOK_BASE/$nb_encoded&format=DBC&direct_download=true" \
            --output "notebooks_to_deploy/$nb.dbc"
        done
    
    - name: Deploy notebooks to Destination Workspace bronze
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"
        
        echo "Creando carpeta base $DEST_BASE si no existe..."
        curl -f -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"
          
        # Procesamos la extensión .dbc de forma nativa
        for file in notebooks_to_deploy/*.dbc; do
          [ -e "$file" ] || continue
          
          name=$(basename "$file" .dbc)
          dest_path="$DEST_BASE/$name"
          
          echo "Importando $file → $dest_path"
          response=$(curl -f -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: multipart/form-data" \
            -F "path=$dest_path" \
            -F "format=DBC" \
            -F "overwrite=true" \
            -F "content=@$file" \
            "$DEST_HOST/api/2.0/workspace/import")
          echo "Response: $response"
        done

    - name: Ejecutar Cuaderno Directamente de setup
      run: |
        # 1. Configurar variables de acceso
        export DATABRICKS_HOST="${{ secrets.DATABRICKS_DEST_HOST }}"
        export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_DEST_TOKEN }}"
        
        # 2. Definir parámetros de entorno
        PROD_STORAGE="datalakefforeroprod03" 
        CATALOG="formula1_prod"
        CREDENTIAL="credential_formula1_prod"
        NOTEBOOK_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb/test"
        
        # 3. Payload JSON para ejecución efímera (runs/submit)
        # Al no declarar ningún clúster, Databricks asume Serverless de forma automática.
        cat <<EOF > run_config.json
        {
          "run_name": "Ejecucion Efimera Serverless desde GitHub Actions",
          "tasks": [
            {
              "task_key": "ejecucion_unica_notebook",
              "notebook_task": {
                "notebook_path": "$NOTEBOOK_PATH",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "$PROD_STORAGE",
                  "catalog": "$CATALOG",
                  "credential": "$CREDENTIAL"
                }
              }
            }
          ]
        }
        EOF

        # 4. Enviar la petición HTTP POST a la API de Databricks
        echo "Disparando ejecución efímera Serverless para: $NOTEBOOK_PATH..."
        
        RESPONSE=$(curl -f -s -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d @run_config.json \
          "$DATABRICKS_HOST/api/2.1/jobs/runs/submit")
          
        echo "Petición aceptada por Databricks."
        echo "Respuesta del Servidor: $RESPONSE"
        
        # 5. Extraer el run_id generado para el monitoreo
        RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id')
        echo "El notebook se está ejecutando en segundo plano bajo el Run ID: $RUN_ID"

