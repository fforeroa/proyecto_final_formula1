          environment_key: Default

        - task_key: 04_Ingest_Drivers_File
          notebook_task:
            notebook_path: /Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/04.Ingest Drivers File
            source: WORKSPACE
          environment_key: Default

        - task_key: 05_Ingest_Results_File
          notebook_task:
