- name: Ejecutar Setup Environment en Serverless
  run: |
    export DATABRICKS_HOST="${{ secrets.DATABRICKS_DEST_HOST }}"
    export DATABRICKS_TOKEN="${{ secrets.DATABRICKS_DEST_TOKEN }}"

    STORAGE_NAME="datalakefforeroprod03"
    CATALOG="formula1_prod"
    CREDENTIAL="credential_formula1_prod"

    NOTEBOOK_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb/01.Setup Project Environment"

    cat <<EOF > run_config.json
    {
      "run_name": "Setup Formula1 Environment",
      "tasks": [
        {
          "task_key": "setup_environment",
          "notebook_task": {
            "notebook_path": "$NOTEBOOK_PATH",
            "source": "WORKSPACE",
            "base_parameters": {
              "storageName": "$STORAGE_NAME",
              "catalog": "$CATALOG",
              "credential": "$CREDENTIAL"
            }
          }
        }
      ]
    }
    EOF

    echo "======================================"
    echo "Ejecutando notebook:"
    echo "$NOTEBOOK_PATH"
    echo "======================================"
    echo "Storage : $STORAGE_NAME"
    echo "Catalog : $CATALOG"
    echo "Credential : $CREDENTIAL"
    echo "======================================"

    RESPONSE=$(curl -f -s -X POST \
      -H "Authorization: Bearer $DATABRICKS_TOKEN" \
      -H "Content-Type: application/json" \
      -d @run_config.json \
      "$DATABRICKS_HOST/api/2.1/jobs/runs/submit")

    echo "Respuesta inicial:"
    echo "$RESPONSE"

    RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id')

    if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
      echo "ERROR: Databricks no devolvió RUN_ID"
      exit 1
    fi

    echo "RUN_ID=$RUN_ID"

    echo "Esperando ejecución del notebook..."

    while true; do

      RUN_RESPONSE=$(curl -s \
        -H "Authorization: Bearer $DATABRICKS_TOKEN" \
        "$DATABRICKS_HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID")

      LIFE_CYCLE=$(echo "$RUN_RESPONSE" | jq -r '.state.life_cycle_state')
      RESULT_STATE=$(echo "$RUN_RESPONSE" | jq -r '.state.result_state')
      STATE_MESSAGE=$(echo "$RUN_RESPONSE" | jq -r '.state.state_message')

      echo "Estado: $LIFE_CYCLE | Resultado: $RESULT_STATE"

      if [ "$LIFE_CYCLE" = "TERMINATED" ]; then

        if [ "$RESULT_STATE" = "SUCCESS" ]; then
          echo "======================================"
          echo "SETUP EJECUTADO CORRECTAMENTE"
          echo "======================================"
          exit 0
        else
          echo "======================================"
          echo "ERROR EN EL NOTEBOOK"
          echo "======================================"
          echo "Resultado: $RESULT_STATE"
          echo "Mensaje: $STATE_MESSAGE"
          echo ""
          echo "Respuesta completa:"
          echo "$RUN_RESPONSE"
          exit 1
        fi
      fi

      if [ "$LIFE_CYCLE" = "INTERNAL_ERROR" ] || [ "$LIFE_CYCLE" = "SKIPPED" ]; then
        echo "======================================"
        echo "ERROR EN LA EJECUCION"
        echo "======================================"
        echo "$RUN_RESPONSE"
        exit 1
      fi

      sleep 10
    done