name: Dynamic Databricks Notebook Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      storageName:
        description: "Nombre del Storage"
        required: true
        default: "datalakefforeroprod03"

      catalog:
        description: "Catalogo"
        required: true
        default: "formula1_prod"

      credential:
        description: "Nombre de la Storage Credential"
        required: true
        default: "credential_formula1_prod"

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout Repository
      uses: actions/checkout@v4


    # ============================================================
    # 2. INSTALAR HERRAMIENTAS
    # ============================================================

    - name: Install jq & curl
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl


    # ============================================================
    # 3. DEFINIR VARIABLES PROD
    # ============================================================

    - name: Definir variables PROD
      run: |

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          STORAGE_NAME="${{ github.event.inputs.storageName }}"
          CATALOG="${{ github.event.inputs.catalog }}"
          CREDENTIAL="${{ github.event.inputs.credential }}"
        else
          STORAGE_NAME="datalakefforeroprod03"
          CATALOG="formula1_prod"
          CREDENTIAL="credential_formula1_prod"
        fi

        echo "STORAGE_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "CATALOG=$CATALOG" >> $GITHUB_ENV
        echo "CREDENTIAL=$CREDENTIAL" >> $GITHUB_ENV

        echo "STORAGE_NAME=$STORAGE_NAME"
        echo "CATALOG=$CATALOG"
        echo "CREDENTIAL=$CREDENTIAL"


    # ============================================================
    # 4. EXPORTAR NOTEBOOKS PREP DESDE DEV
    # ============================================================

    - name: Exportar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_prep

        NOTEBOOKS=(
          "01.Setup Project Environment"
          "02.Ayuda_Bronze"
          "03.Configuracion_Ambiente"
          "04.Ayuda_Silver"
          "test"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "Exportando: $NOTEBOOK"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb/$NOTEBOOK', safe=''))")

          curl -f -s \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=DBC" \
            > "exported_prep/${NOTEBOOK}.json"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 5. IMPORTAR NOTEBOOKS PREP A PROD
    # ============================================================

    - name: Importar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
        echo "Creando directorio:"
        echo "$DEST_PATH"

        curl -f -sS \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"path\": \"$DEST_PATH\",
            \"overwrite\": true
          }" \
           "$DATABRICKS_HOST/api/2.0/workspace/mkdirs"
        
        echo "Directorio creado o ya existente"

        for FILE in exported_prep/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo "Importando: $NOTEBOOK"

          CONTENT=$(jq -r '.content' "$FILE")

          curl -f -s \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"DBC\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 6. EXPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Exportar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_bronze

        NOTEBOOKS=(
          "01.Ingest Circuits File"
          "02.Ingest Races File"
          "03.Ingest Constructors File"
          "04.Ingest Drivers File"
          "05.Ingest Results File"
          "06.Ingest Sprints File"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "Exportando: $NOTEBOOK"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/$NOTEBOOK', safe=''))")

          curl -f -s \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=DBC" \
            > "exported_bronze/${NOTEBOOK}.json"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 7. IMPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Importar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"

        for FILE in exported_bronze/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo "Importando: $NOTEBOOK"

          CONTENT=$(jq -r '.content' "$FILE")

          curl -f -sS \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"DBC\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 8. CREAR EXTERNAL LOCATION METASTORE
    # ============================================================

    - name: Crear External Location exlt-metastore
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        RESPONSE=$(curl -s \
          -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"exlt-metastore_prod\",
            \"url\": \"abfss://metastore@${STORAGE_NAME}.dfs.core.windows.net/\",
            \"credential_name\": \"${CREDENTIAL}\",
            \"comment\": \"External Location Metastore Formula1\"
          }" \
          "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations")

        echo "$RESPONSE"


    # ============================================================
    # 9. CREAR EXTERNAL LOCATIONS
    # ============================================================

    - name: Crear External Locations PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        create_external_location() {

          LOCATION_NAME="$1"
          CONTAINER="$2"

          echo ""
          echo "========================================"
          echo "Creando External Location: $LOCATION_NAME"
          echo "========================================"

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$LOCATION_NAME\",
              \"url\": \"abfss://${CONTAINER}@${STORAGE_NAME}.dfs.core.windows.net/\",
              \"credential_name\": \"${CREDENTIAL}\",
              \"comment\": \"External Location Formula1 PROD\"
            }" \
            "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations")

          echo "$RESPONSE"

        }

        create_external_location "exlt-raw_prod" "raw"
        create_external_location "exlt-bronze_prod" "bronze"
        create_external_location "exlt-silver_prod" "silver"
        create_external_location "exlt-golden_prod" "golden"


    # ============================================================
    # 10. CREAR CATALOGO
    # ============================================================

    - name: Crear Catalogo Unity Catalog
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "Creando catalogo: $CATALOG"

        RESPONSE=$(curl -s \
          -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"name\": \"$CATALOG\",
            \"storage_root\": \"abfss://metastore@${STORAGE_NAME}.dfs.core.windows.net/\",
            \"comment\": \"Catalogo para la arquitectura medallion del proyecto Formula1 PROD\"
          }" \
          "$DATABRICKS_HOST/api/2.1/unity-catalog/catalogs")

        echo "$RESPONSE"


    # ============================================================
    # 11. CREAR SCHEMAS
    # ============================================================

    - name: Crear Schemas Bronze Silver Gold
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        create_schema() {

          SCHEMA="$1"
          CONTAINER="$2"

          echo ""
          echo "========================================"
          echo "Creando schema: $CATALOG.$SCHEMA"
          echo "========================================"

          RESPONSE=$(curl -s \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"$SCHEMA\",
              \"catalog_name\": \"$CATALOG\",
              \"storage_root\": \"abfss://${CONTAINER}@${STORAGE_NAME}.dfs.core.windows.net/${SCHEMA}\",
              \"comment\": \"Schema $SCHEMA del proyecto Formula1 PROD\"
            }" \
            "$DATABRICKS_HOST/api/2.1/unity-catalog/schemas")

          echo "$RESPONSE"

        }

        create_schema "bronze" "bronze"
        create_schema "silver" "silver"
        create_schema "gold" "golden"
 
    - name: Ejecutar Ingest Circuits File PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        NOTEBOOK_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/01.Ingest Circuits File"

        cat <<EOF > run_config.json
        {
          "run_name": "Formula1 - Ingest Circuits File PROD",
          "tasks": [
            {
              "task_key": "ingest_circuits",
              "notebook_task": {
                "notebook_path": "$NOTEBOOK_PATH",
                "source": "WORKSPACE",
                "base_parameters": {
                  "storageName": "$STORAGE_NAME",
                  "catalogo": "$CATALOG"
                }
              }
            }
          ]
        }
        EOF

        echo "========================================"
        echo "CONFIGURACION DEL JOB"
        echo "========================================"
        cat run_config.json
        echo "========================================"


        # ------------------------------------------------------------
        # INICIAR RUN
        # ------------------------------------------------------------

        RESPONSE=$(curl -f -sS \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d @run_config.json \
          "$DATABRICKS_HOST/api/2.1/jobs/runs/submit")

        echo "Respuesta:"
        echo "$RESPONSE"

        RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id')

        echo "========================================"
        echo "RUN_ID = $RUN_ID"
        echo "========================================"


        if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
          echo "ERROR: No se pudo iniciar el Job"
          exit 1
        fi


        # ------------------------------------------------------------
        # ESPERAR A QUE TERMINE
        # ------------------------------------------------------------

        echo "Esperando ejecucion del notebook..."

        while true; do

          RUN_STATUS=$(curl -f -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/runs/get?run_id=$RUN_ID")

          LIFE_CYCLE=$(echo "$RUN_STATUS" | jq -r '.state.life_cycle_state')
          RESULT_STATE=$(echo "$RUN_STATUS" | jq -r '.state.result_state')
          STATE_MESSAGE=$(echo "$RUN_STATUS" | jq -r '.state.state_message')

          echo ""
          echo "----------------------------------------"
          echo "Life Cycle : $LIFE_CYCLE"
          echo "Result     : $RESULT_STATE"
          echo "Message    : $STATE_MESSAGE"
          echo "----------------------------------------"

          if [ "$LIFE_CYCLE" = "TERMINATED" ] || \
            [ "$LIFE_CYCLE" = "SKIPPED" ] || \
            [ "$LIFE_CYCLE" = "INTERNAL_ERROR" ]; then
            break
          fi

          sleep 10

        done


        # ------------------------------------------------------------
        # MOSTRAR RESULTADO
        # ------------------------------------------------------------

        echo ""
        echo "========================================"
        echo "RESULTADO FINAL"
        echo "========================================"

        echo "$RUN_STATUS" | jq .


        # ------------------------------------------------------------
        # OBTENER OUTPUT DEL NOTEBOOK
        # ------------------------------------------------------------

        echo ""
        echo "========================================"
        echo "BUSCANDO OUTPUT DE LA TAREA"
        echo "========================================"

        TASK_RUN_ID=$(echo "$RUN_STATUS" | jq -r \
          '.tasks[] | select(.task_key=="ingest_circuits") | .run_id' | tail -1)

        echo "TASK_RUN_ID = $TASK_RUN_ID"

        if [ "$TASK_RUN_ID" = "null" ] || [ -z "$TASK_RUN_ID" ]; then
          echo "ERROR: No se encontró el run_id de la tarea ingest_circuits"
          exit 1
        fi

        echo ""
        echo "========================================"
        echo "OUTPUT DEL NOTEBOOK"
        echo "========================================"

        OUTPUT_RESPONSE=$(curl -sS \
          -w "\n%{http_code}" \
          -X GET \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          "$DATABRICKS_HOST/api/2.1/jobs/runs/get-output?run_id=$TASK_RUN_ID")

        OUTPUT_HTTP_CODE=$(echo "$OUTPUT_RESPONSE" | tail -n 1)
        OUTPUT_BODY=$(echo "$OUTPUT_RESPONSE" | sed '$d')

        echo "HTTP CODE = $OUTPUT_HTTP_CODE"
        echo ""

        if [ "$OUTPUT_HTTP_CODE" != "200" ]; then
          echo "ERROR obteniendo output del notebook:"
          echo "$OUTPUT_BODY" | jq . 2>/dev/null || echo "$OUTPUT_BODY"
        else
          echo "$OUTPUT_BODY" | jq .
        fi


        # ------------------------------------------------------------
        # VALIDAR RESULTADO
        # ------------------------------------------------------------

        if [ "$RESULT_STATE" != "SUCCESS" ]; then
          echo ""
          echo "ERROR: El notebook termino con estado $RESULT_STATE"
          exit 1
        fi

        echo ""
        echo "Notebook ejecutado correctamente."
