name: Dynamic Databricks Notebook Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      storageName:
        description: "Nombre del Storage"
        required: true
        default: "datalakefforeroprod03"

      catalog:
        description: "Catalogo"
        required: true
        default: "formula1_prod"

      credential:
        description: "Nombre de la Storage Credential"
        required: true
        default: "credential_formula1_prod"

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    # ============================================================
    # 1. CHECKOUT
    # ============================================================

    - name: Checkout Repository
      uses: actions/checkout@v4


    # ============================================================
    # 2. INSTALAR HERRAMIENTAS
    # ============================================================

    - name: Install jq & curl
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl


    # ============================================================
    # 3. DEFINIR VARIABLES PROD
    # ============================================================

    - name: Definir variables PROD
      run: |

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          STORAGE_NAME="${{ github.event.inputs.storageName }}"
          CATALOG="${{ github.event.inputs.catalog }}"
          CREDENTIAL="${{ github.event.inputs.credential }}"
        else
          STORAGE_NAME="datalakefforeroprod03"
          CATALOG="formula1_prod"
          CREDENTIAL="credential_formula1_prod"
        fi

        echo "STORAGE_NAME=$STORAGE_NAME" >> $GITHUB_ENV
        echo "CATALOG=$CATALOG" >> $GITHUB_ENV
        echo "CREDENTIAL=$CREDENTIAL" >> $GITHUB_ENV

        echo "STORAGE_NAME=$STORAGE_NAME"
        echo "CATALOG=$CATALOG"
        echo "CREDENTIAL=$CREDENTIAL"

    # ============================================================
    # CREAR ESTRUCTURA DE CARPETAS EN PROD
    # ============================================================

    - name: Crear estructura Workspace PROD
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        echo "========================================"
        echo "CREANDO ESTRUCTURA WORKSPACE PROD"
        echo "========================================"

        FOLDERS=(
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver"
          "/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/03-gold"
        )

        for FOLDER in "${FOLDERS[@]}"; do

          echo ""
          echo "Verificando/creando:"
          echo "$FOLDER"

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\":\"$FOLDER\"}" \
            "$DATABRICKS_HOST/api/2.0/workspace/mkdirs")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "$BODY"
            exit 1
          fi

          echo "OK"

        done

        echo ""
        echo "========================================"
        echo "ESTRUCTURA WORKSPACE LISTA"
        echo "========================================"

    # ============================================================
    # 4. EXPORTAR NOTEBOOKS PREP DESDE DEV
    # ============================================================

    - name: Exportar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_prep

        NOTEBOOKS=(
          "01.Setup Project Environment"
          "02.Ayuda_Bronze"
          "03.Configuracion_Ambiente"
          "04.Ayuda_Silver"
          "test"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "Exportando: $NOTEBOOK"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb/$NOTEBOOK', safe=''))")

          curl -f -s \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=DBC" \
            > "exported_prep/${NOTEBOOK}.json"

          echo "OK: $NOTEBOOK"

        done


    # ============================================================
    # 5. IMPORTAR NOTEBOOKS PREP A PROD
    # ============================================================

    - name: Importar notebooks PrepAmb
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/PrepAmb"
        echo "Creando directorio:"
        echo "$DEST_PATH"

        curl -f -sS \
          -X POST \
          -H "Authorization: Bearer $DATABRICKS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"path\": \"$DEST_PATH\",
            \"overwrite\": true
          }" \
           "$DATABRICKS_HOST/api/2.0/workspace/mkdirs"
        
        echo "Directorio creado o ya existente"

        for FILE in exported_prep/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo "Importando: $NOTEBOOK"

          CONTENT=$(jq -r '.content' "$FILE")

          curl -f -s \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"DBC\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import"

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 6. EXPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Exportar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_bronze

        NOTEBOOKS=(
          "01.Ingest Circuits File"
          "02.Ingest Races File"
          "03.Ingest Constructors File"
          "04.Ingest Drivers File"
          "05.Ingest Results File"
          "06.Ingest Sprints File"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "========================================"
          echo "Exportando: $NOTEBOOK"
          echo "========================================"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze/$NOTEBOOK', safe=''))")

          curl -f -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=SOURCE" \
            > "exported_bronze/${NOTEBOOK}.json"

          echo "Validando JSON..."

          jq empty "exported_bronze/${NOTEBOOK}.json"

          echo "Contenido exportado:"
          jq -r '.content' "exported_bronze/${NOTEBOOK}.json" | wc -c

          echo "OK: $NOTEBOOK"

        done
    

    # ============================================================
    # 7. IMPORTAR NOTEBOOKS BRONZE
    # ============================================================

    - name: Importar notebooks Bronze
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/01-Bronze"

        echo "========================================"
        echo "IMPORTANDO NOTEBOOKS BRONZE"
        echo "========================================"

        for FILE in exported_bronze/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo ""
          echo "========================================"
          echo "Importando: $NOTEBOOK"
          echo "========================================"

          CONTENT=$(jq -r '.content' "$FILE")

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "ERROR: El archivo no contiene content"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"SOURCE\",
              \"language\": \"PYTHON\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "Respuesta:"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR importando $NOTEBOOK"
            exit 1
          fi

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 8. EXPORTAR NOTEBOOKS SILVER
    # ============================================================

    - name: Exportar notebooks Silver
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_ORIGIN_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_ORIGIN_TOKEN }}

      run: |

        mkdir -p exported_silver

        NOTEBOOKS=(
          "01.Transform Circuits Data"
          "02.Transform Races Data"
          "03.Transform Constructors Data"
          "04.Transform Drivers Data"
          "05.Transform Results Data"
          "06.Transform Sprints Data"
          "91.Build_Nationality_Region_Reference"
        )

        for NOTEBOOK in "${NOTEBOOKS[@]}"; do

          echo "========================================"
          echo "Exportando: $NOTEBOOK"
          echo "========================================"

          ENCODED_PATH=$(python -c "import urllib.parse; print(urllib.parse.quote('/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver/$NOTEBOOK', safe=''))")

          curl -f -sS \
            -X GET \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.0/workspace/export?path=$ENCODED_PATH&format=SOURCE" \
            > "exported_silver/${NOTEBOOK}.json"

          echo "Validando JSON..."

          jq empty "exported_silver/${NOTEBOOK}.json"

          echo "Contenido exportado:"
          jq -r '.content' "exported_silver/${NOTEBOOK}.json" | wc -c

          echo "OK: $NOTEBOOK"

        done

    # ============================================================
    # 9. IMPORTAR NOTEBOOKS SILVER
    # ============================================================

    - name: Importar notebooks Silver
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}

      run: |

        DEST_PATH="/Workspace/Users/fcamifox@gmail.com/proyecto_final_formula1/proceso/02-Silver"

        echo "========================================"
        echo "IMPORTANDO NOTEBOOKS SILVER"
        echo "========================================"

        for FILE in exported_silver/*.json; do

          NOTEBOOK=$(basename "$FILE" .json)

          echo ""
          echo "========================================"
          echo "Importando: $NOTEBOOK"
          echo "========================================"

          CONTENT=$(jq -r '.content' "$FILE")

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "ERROR: El archivo no contiene content"
            exit 1
          fi

          RESPONSE=$(curl -sS \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"$DEST_PATH/$NOTEBOOK\",
              \"format\": \"SOURCE\",
              \"language\": \"PYTHON\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }" \
            "$DATABRICKS_HOST/api/2.0/workspace/import")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP CODE = $HTTP_CODE"
          echo "Respuesta:"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR importando $NOTEBOOK"
            exit 1
          fi

          echo "OK: $NOTEBOOK"

        done